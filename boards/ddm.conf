# DDM configuration file.
#
# This file lists the libraries and devices to load. Each one
# self-registers with ddm.library on init. After all are
# loaded, DDM_MatchAll is called to bind drivers to devices.

# Subsystem libraries (provide bus frameworks)
LIBS:spi.library
LIBS:mmc.library
LIBS:parallelport.library
LIBS:clockport.library

# Bus and adapter drivers
LIBS:cia-parallelport.library
LIBS:par-spi.library
LIBS:gayle-clockport.library
LIBS:spider.library
DEVS:mmc-spi.device
